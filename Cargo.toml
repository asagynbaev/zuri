[package]
name = "zuri"
version = "0.1.0"
edition = "2024"

[dependencies]
# Token-2022 + confidential transfers. All on the zk-sdk 7 line: the proof wire
# format is unchanged since zk-sdk 6, which is what devnet's ZK ElGamal Proof
# program verifies, so no 4.0 <-> 6.x bypass is needed (unlike the Confidential-
# Balances-Sample, which predates spl-token-2022 11).
spl-token-2022-interface = "3.1.1"
spl-associated-token-account-interface = "2"
spl-token-confidential-transfer-proof-generation = "0.6.1"
spl-token-confidential-transfer-proof-extraction = "0.6.1"
spl-record = { version = "0.4", features = ["no-entrypoint"] }
solana-zk-sdk = "7"
solana-zk-sdk-pod = "0.1.2"
solana-zk-elgamal-proof-interface = "0.1.3"

# Solana client (versions match what solana-rpc-client 4.1 resolves to).
solana-rpc-client = "4"
solana-rpc-client-types = "4"
solana-transaction-status-client-types = "4"
solana-commitment-config = "3"
solana-transaction = { version = "4", features = ["wincode"] }
solana-instruction = "3"
solana-address = "2"
solana-keypair = "3"
solana-signer = "3"
solana-signature = "3"
solana-system-interface = { version = "3", features = ["bincode"] }

tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
